name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへの push が続いたら、古い実行を止めて最新だけを走らせる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ワークフローに与える権限を読み取りだけに絞る。
# 依存パッケージが乗っ取られても、リポジトリへの書き込みはできない。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ローカルの docker-compose.yml と同じ Postgres 18 を立てる
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: attendance
          POSTGRES_DB: attendance
          TZ: UTC
          PGTZ: UTC
        ports:
          # ローカルに合わせてホスト側は 5433
          - 5433:5432
        # 接続を受け付けられるまで、後続のステップを待たせる
        options: >-
          --health-cmd "pg_isready -U attendance -d attendance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # CI には .env が無いので、テストが読む接続先を環境変数で渡す
      TEST_DATABASE_URL: postgres://attendance:attendance@localhost:5433/attendance_test

    steps:
      - uses: actions/checkout@v7

      # package.json の packageManager（pnpm@12.4.2）を読んで同じバージョンを入れる
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # lockfile と package.json が食い違っていたら失敗させる（勝手に更新しない）
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # 実際のブラウザで、web（本番ビルド）・API・DB を通して確かめる。
  # check と並行して走らせる（ブラウザの準備に時間がかかるので、直列にすると待ち時間が伸びる）
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: attendance
          POSTGRES_DB: attendance
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U attendance -d attendance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgres://attendance:attendance@localhost:5433/attendance_e2e

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ブラウザ本体と、Linux で動かすための OS の依存を入れる。
      # Playwright の公式はブラウザのキャッシュを推奨していない
      # （復元とダウンロードの時間がほぼ同じで、OS の依存はキャッシュできないため）
      - run: pnpm -F @attendance/e2e exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      # 失敗したときだけ、スクリーンショット・操作の記録（トレース）を含むレポートを残す
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
